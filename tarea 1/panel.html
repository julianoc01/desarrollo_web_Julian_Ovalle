<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="tarea1.css">
    <title>Title</title>
</head>
<body>
<h1> Avistamientos de aves</h1>

<div>
    <h2> Anadir avistamiento</h2>
    <form id="formAvistamiento">
        <div>
            <label for="ave"> Ave avistada</label>
            <input id="ave" >
        </div>
        <div>
            <label for="fecha"> Fecha del avistamiento</label>
            <input type="date" id="fecha">
        </div>
        <div>
            <label for="lugar"> Lugar del avistamiento</label>
            <input id="lugar">
        </div>
        <div>
            <label for="foto"> Foto o video del encuentro</label>
            <input type="file" id="foto">
        </div>
        <div>
            <label for="comentario"> Comentarios sobre el avistamiento</label>
            <input id="comentario">
        </div>
        <div>
            <button type="submit" id="avistamiento">  Registrar avistamiento</button>
        </div>
    </form>
</div>
<div>
    <h2>Avistamientos registrados</h2>
    <div id="listaAvistamientos"> <!-- Aquí aparecerán los avistamientos --> </div>
</div>
<script src="panel.js"></script>
</body>
</html>
